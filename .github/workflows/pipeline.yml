name: GoSQLGuard CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  Test:
    runs-on: self-hosted-linux

    # Fetch tier (cluster-services-1506): self-hosted ARC runner (SupportTools org pool).
    #   - Go toolchain: baked into the runner image (1.26.x, also in the tool cache); no setup-go
    #     download, GOTOOLCHAIN=local. The module declares go 1.23.0; gosec v2.30.0 needs >= 1.26.
    #   - Go modules and the two pinned analysis tools: Athens only (GOPROXY=https://goproxy.support.tools,
    #     a cache we run, no upstream fallback), go.sum / sum.golang.org verified.
    #   - helm (chart check): baked into the runner image.
    env:
      STATICCHECK_VERSION: v0.8.2   # honnef.co/go/tools, needs Go >= 1.26
      GOSEC_VERSION: v2.30.0        # github.com/securego/gosec/v2, needs Go >= 1.26
      GOPROXY: https://goproxy.support.tools
      GOTOOLCHAIN: local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify baked Go
        run: |
          set -euo pipefail
          command -v go >/dev/null 2>&1 || { echo "::error::go is missing from this self-hosted runner; it must be baked into the runner image (no download fallback)."; exit 1; }
          go version

      - name: Install static analysis tools (pinned)
        run: |
          echo "go module source: GOPROXY=${GOPROXY}"
          GOBIN="${RUNNER_TEMP}/bin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Go static analysis
        run: |
          # staticcheck is advisory for now
          staticcheck ./... || true
          go vet ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Chart values template check
        run: scripts/check-chart-values-template.sh

      - name: Dependency management
        run: |
          go mod vendor
          go mod verify
          go mod tidy

      - name: Security scanning
        run: |
          # Run gosec with specific exclusions for false positives
          # G104: Audit errors not checked - too strict for WriteTo/Write/Encode operations
          # G203: XSS via fmt.Fprintf - false positive for HTML template generation
          # G204: Subprocess with variables - controlled environment, parameters are sanitized
          # G304: File path inclusion - paths are controlled and validated
          gosec -exclude=G104,G203,G204,G304 ./...

  Build:
    needs: Test
    runs-on: self-hosted-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # BuildKit from the Harbor Docker Hub proxy, pinned by index digest (cluster-services-1487)
          driver-opts: image=harbor.support.tools/dockerhub/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Fetch tiers: see the Dockerfile header. Base images from the Harbor Docker Hub proxy by digest,
      # Go modules from Athens only, apt from fetch-cache with no upstream fallback.
      # (The old --cache-from supporttools/gosqlguard:latest pulled from Docker Hub and never matched:
      # no build exported a cache. Dropped.)
      - name: Docker build and push
        run: |
          docker buildx build \
          --platform linux/amd64 \
          --pull \
          --build-arg VERSION=v${{ github.run_number }} \
          --build-arg GIT_COMMIT=${{ github.sha }} \
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
          --build-arg GOPROXY=https://goproxy.support.tools \
          --build-arg APT_FALLBACK=none \
          -t supporttools/gosqlguard:"0.1.${{ github.run_number }}" \
          -t supporttools/gosqlguard:latest \
          ${{ github.event_name == 'push' && '--push' || '' }} \
          -f Dockerfile .

  Publish:
    # Only merged code is published; pull requests build the image without pushing it.
    if: github.event_name == 'push'
    # Self-hosted (cluster-services-1506): helm and envsubst are baked into the runner image, so
    # there is no setup-helm download from get.helm.sh.
    runs-on: self-hosted-linux
    needs:
      - Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Helm version (baked)
        run: helm version --short

      - name: Helm Lint
        run: helm lint charts/gosqlguard/

      - name: Package Helm chart
        run: |
          export CHART_VERSION="0.1.${{ github.run_number }}"
          export APP_VERSION="0.1.${{ github.run_number }}"
          export IMAGE_TAG="0.1.${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          envsubst < charts/gosqlguard/Chart.yaml.template > charts/gosqlguard/Chart.yaml
          envsubst < charts/gosqlguard/values.yaml.template > charts/gosqlguard/values.yaml
          helm package charts/gosqlguard --destination helm/repo

      - name: Mint helm-chart repo token (GitHub App supporttools-chart-publisher)
        id: chart-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHART_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHART_APP_PRIVATE_KEY }}
          owner: SupportTools
          repositories: helm-chart,helm-chart-private

      - name: Checkout helm-chart repository
        uses: actions/checkout@v4
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ steps.chart-app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          mkdir -p helm/repo
          cp helm/repo/gosqlguard-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for gosqlguard"
          git push
